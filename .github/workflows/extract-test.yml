name: extract-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd scripts && python - <<'PY'
          import json, extract_events as x
          news=json.load(open('../docs/data/news.json'))
          for n in [n for n in news if n['cat']=='official'][:14]:
              try:
                  print('RESULT', n['date'], n['title'][:30], '=>', x.extract(n, x.fetch(n['url'])))
              except Exception as e:
                  print('RESULT ERR', n['url'], e)
          PY
