name: date-debug
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 - <<'PY'
          import re, fetch_news as f, json
          for u in ['https://www.walkerplus.com/article/1003319/']:
              try:
                  p=f.fetch(u)
                  print('DBG len',len(p))
                  for pat in ['published','datePublished','dateCreated','年[0-9]+月[0-9]+日','<time']:
                      for m in list(re.finditer(pat,p))[:3]:
                          print('DBG',pat,'=>',p[max(0,m.start()-120):m.end()+80].replace(chr(10),' '))
              except Exception as e:
                  print('DBG ERR',repr(e))
          PY
