name: ぴよりんニュースを更新

on:
  schedule:
    # 1時間ごと（毎時23分。混み合う0分台を避けて遅れを減らす）
    - cron: "23 * * * *"
  workflow_dispatch: {}   # Actions画面の「Run workflow」で手動実行もできる

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest に入っている Python をそのまま使う（準備の時間を省く）
      - name: ニュースを収集
        run: python3 scripts/fetch_news.py

      - name: カレンダーの予定を抽出
        run: python3 scripts/extract_events.py
        env:
          # Settings → Secrets and variables → Actions に登録したClaudeのAPIキー
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "ニュース・予定更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash -q || true
            git push
          fi
