name: ぴよりんニュースを更新

on:
  schedule:
    # 3時間ごと（UTC表記。日本時間では 0,3,6,9,12,15,18,21 時の少し後）
    - cron: "17 */3 * * *"
  workflow_dispatch: {}   # Actions画面の「Run workflow」で手動実行もできる

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ニュースを収集
        run: python scripts/fetch_news.py

      - name: カレンダーの予定を抽出
        run: python scripts/extract_events.py
        env:
          # Settings → Secrets and variables → Actions に登録したClaudeのAPIキー
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "ニュース・予定更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
